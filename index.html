<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<title>Trail Strength Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<script>
// Theme: "auto" follows the phone, "light"/"dark" override it. Kept on this device only.
(function(){ var t=null; try{ t=localStorage.getItem("tsl-theme"); }catch(e){}
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* Layout: one phone-width column. Compact race and week header, today's session as cards you fill set by set,
   tab bar at the bottom where the thumb is. Palette and type follow the UI/UX Pro Max "Fitness" entry:
   energy orange for action, green for done, dark-first, Barlow Condensed + Barlow. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#e9ecf1; --fg:#0f172a; --muted:#526075; --line:#d7dce4;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#ffedd5; --accent-text:#c2410c;
  --done:#15803d; --done-ink:#ffffff; --done-soft:#dcfce7;
  --warn:#b45309; --warn-soft:#fef3c7; --focus:#2563eb;
  --shadow:0 1px 2px rgb(15 23 42 / .06), 0 1px 1px rgb(15 23 42 / .04);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f17; --surface:#151b26; --sunk:#1e2633; --fg:#f1f5f9; --muted:#9aa7b8; --line:#2a3342;
  --accent:#f97316; --accent-ink:#0b0f17; --accent-soft:#3a2312; --accent-text:#fb923c;
  --done:#22c55e; --done-ink:#04130a; --done-soft:#11301e;
  --warn:#fbbf24; --warn-soft:#3a2f10; --focus:#7cb4ff; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f17; --surface:#151b26; --sunk:#1e2633; --fg:#f1f5f9; --muted:#9aa7b8; --line:#2a3342;
  --accent:#f97316; --accent-ink:#0b0f17; --accent-soft:#3a2312; --accent-text:#fb923c;
  --done:#22c55e; --done-ink:#04130a; --done-soft:#11301e;
  --warn:#fbbf24; --warn-soft:#3a2f10; --focus:#7cb4ff; --shadow:none; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:20px;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:24px}
h3{font-size:20px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
button,label.btn,summary{cursor:pointer;touch-action:manipulation}
:is(button,input,select,textarea,summary,label.btn):focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:32px}
.topright{display:flex;align-items:center;gap:8px;min-width:0}
.themebtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;padding:0;position:relative}
.themebtn .icon{width:20px;height:20px}
.themebtn .tag{position:absolute;bottom:-3px;right:-3px;font-size:9px;font-weight:700;line-height:1;padding:2px 3px;border-radius:5px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="ok"] .dot{background:var(--done)}
.sync[data-state="off"] .dot{background:var(--warn)}
.sync[data-state="off"]{color:var(--fg)}
.racecard[hidden]{display:none}
.racecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.race-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.race-main .days{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;color:var(--accent-text)}
.race-main .days small{font-size:20px;margin-left:4px;color:var(--fg)}
.race-main .who{text-align:right;min-width:0}
.race-main .who b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.race-main .who span{font-size:13px;color:var(--muted)}
.race-next{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.race-next b{color:var(--fg);font-weight:600}
.weekbar{display:flex;flex-direction:column;gap:6px}
.weekbar .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.weekbar .line b{font-family:var(--display);font-size:18px}
.track{display:grid;grid-template-columns:repeat(22,1fr);gap:2px;height:6px}
.track i{border-radius:2px;background:var(--sunk)}
.track i.past{background:var(--muted);opacity:.55}
.track i.now{background:var(--accent)}
.track i.race{background:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent-text)}
.badge.done{background:var(--done-soft);color:var(--done)}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:48px;position:relative}
.tabbar button .icon{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--accent-text)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Controls */
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.daynav .mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.linkbtn{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:14px;padding:4px 8px;min-height:32px;border-radius:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;font-weight:600;font-size:15px;min-height:40px;border-radius:9px;color:var(--muted)}
.seg.pick{grid-template-columns:1fr 1.4fr}
.seg .pickwrap{display:block;border-radius:9px;position:relative}
.seg .pickwrap select{width:100%;height:100%;min-height:40px;border:0;background:transparent;font:inherit;font-weight:600;font-size:15px;color:var(--muted);padding:0 10px;border-radius:9px;appearance:auto}
.seg .pickwrap[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.seg .pickwrap[aria-pressed="true"] select{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
#view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.note{font-size:14px;color:var(--muted)}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--warn-soft);border-radius:12px;font-size:14px}
.callout .icon{color:var(--warn);margin-top:1px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);font:700 17px var(--body);min-height:52px;padding:12px 18px;border-radius:14px;width:100%}
.primary[disabled]{opacity:.65;cursor:progress}
.ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:15px;min-height:44px;padding:8px 14px;border-radius:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;min-height:20px}
.status.ok{color:var(--done)}
.status.off{color:var(--warn)}
textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}

/* Session */
.sesshead{position:sticky;top:0;z-index:10;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:8px}
.sesshead .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sesshead h2{font-size:22px}
.sesshead .count{font-weight:600;font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--done);border-radius:999px;width:0}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .25s ease-out}.chk{transition:background .15s,border-color .15s}}
details.prep{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
details.prep summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;font-weight:600;min-height:52px}
details.prep summary::-webkit-details-marker{display:none}
details.prep summary .chev{transition:transform .2s}
details.prep[open] summary .chev{transform:rotate(90deg)}
details.rcday{border-top:1px solid var(--line)}
details.rcday summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;min-height:44px}
details.rcday summary::-webkit-details-marker{display:none}
.rclist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.rclist li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rclist .chk{flex:none;width:32px;height:32px}
.rclist li span{padding-top:5px}
details.prep .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.ex{gap:10px}
.ex.complete{border-color:var(--done)}
details.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
details.ex.complete{border-color:var(--done)}
details.ex summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:56px;cursor:pointer}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary h3{font-size:18px}
details.ex summary .exmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
details.ex summary .exsub{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
details.ex summary .exdone{font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
details.ex summary .exdone .icon{width:14px;height:14px;stroke-width:3;display:none}
details.ex.complete summary .exdone{color:var(--done)}
details.ex.complete summary .exdone .icon{display:inline}
details.ex summary .chev{flex:none;transition:transform .2s;color:var(--muted)}
details.ex[open] summary .chev{transform:rotate(90deg)}
details.ex .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rx{font-weight:600;font-size:14px;white-space:nowrap;padding:3px 8px;border-radius:8px;background:var(--sunk)}
.how{font-size:14px;color:var(--muted)}
.demo{width:100%}
.demobtn{display:inline-flex;align-items:center;gap:6px}
.demo iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block;background:#000}
.why{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--muted);font-style:italic}
.why .icon{flex:none;margin-top:2px}
.principles{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.principles li{display:flex;flex-direction:column;gap:2px}
.principles b{font-family:var(--display);font-size:17px}
.foodchips{display:flex;flex-wrap:wrap;gap:8px}
.foodchips button{min-height:40px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.foodchips button .icon{width:16px;height:16px;stroke-width:3;display:none}
.foodchips button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.foodchips button[aria-pressed="true"] .icon{display:inline}
.fuelrules{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.fuelrules li{display:flex;flex-direction:column;gap:2px;font-size:14px}
.fueltip{display:flex;gap:10px;align-items:flex-start}
.fueltip .icon{flex:none;color:var(--accent, currentColor);margin-top:2px}
details.fuelrace{border-top:1px solid var(--line)}
details.fuelrace summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;min-height:44px}
details.fuelrace summary::-webkit-details-marker{display:none}
details.fuelrace ul{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.quote{border-left:3px solid var(--accent, currentColor);padding:4px 12px;margin:0;font-style:italic}
.last{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fg);font-weight:500}
.last .icon{color:var(--muted)}
.sets{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;align-items:center}
.sets .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sets .setno{font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px}
.side{font-size:11px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:4px;padding:1px 4px}
input[type=number]{width:100%;min-width:0;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:600 18px var(--body);font-variant-numeric:tabular-nums;text-align:center;-moz-appearance:textfield}
input[type=number]::placeholder{color:var(--muted);opacity:.6;font-weight:500}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sets.done-row input{border-color:transparent;background:var(--done-soft)}
.chk{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0}
.chk .icon{width:22px;height:22px;stroke-width:3}
.chk[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.nokg{height:48px;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* Rest day */
.restday{align-items:flex-start}
.restday .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.restday .big .icon{width:30px;height:30px}
.restday ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;width:100%}
.restday li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:10px;font-weight:500}

/* Plan */
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week7 div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:var(--sunk);font-size:12px;text-align:center}
.week7 b{font-size:13px}
.week7 .k-str{background:var(--accent-soft);color:var(--accent-text)}
.week7 .is-today{outline:2px solid var(--fg);outline-offset:-2px}
.tl{display:flex;flex-direction:column;position:relative}
.tlrow{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:0 0 16px}
.tlrow .rail{position:relative;display:flex;justify-content:center}
.tlrow .rail::before{content:"";position:absolute;top:6px;bottom:-16px;width:2px;background:var(--line)}
.tlrow:last-child .rail::before{display:none}
.tlrow .rail i{position:relative;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);margin-top:5px}
.tlrow.past .rail i{background:var(--muted)}
.tlrow.now .rail i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tlrow.race-row .rail i{border-radius:3px;background:var(--fg);border-color:var(--fg)}
.tlrow .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.tlrow b{font-family:var(--display);font-size:19px}
.tlrow .wk{font-size:13px;color:var(--muted);font-weight:500}
.tlrow.now .box{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:-4px 0 0 -4px}

/* History */
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%;box-shadow:var(--shadow);min-height:64px}
.hitem .date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sunk);border-radius:10px;height:52px}
.hitem .date b{font-family:var(--display);font-size:22px;line-height:1}
.hitem .date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hitem .what{min-width:0;display:flex;flex-direction:column;gap:2px}
.hitem .what .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .right{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px}
.empty{align-items:center;text-align:center;padding:28px 16px}
.empty .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}

/* Knee */
.kgoal{display:flex;flex-direction:column;gap:8px}
.krow{display:grid;grid-template-columns:1fr 72px 72px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.krow.head{border-top:0;padding:0;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.krow .d{display:flex;flex-direction:column;gap:4px;min-width:0}
.krow .d b{font-weight:600}
.krow .gap{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.gap-good{color:var(--done)}
.gap-bad{color:var(--warn)}
.krow.next{background:var(--accent-soft);margin:0 -16px;padding:10px 16px;border-top-color:transparent}
.compare{display:flex;flex-direction:column;gap:6px}
.compare .r{display:grid;grid-template-columns:44px 1fr 32px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.compare .r .b{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.compare .r .b span{display:block;height:100%;border-radius:999px}
</style>
</head>

function prescription(session, w){
  const wk = WORKOUTS[session]; if(!wk) return null;
  const p = phaseOf(w); const half = !!(p && p.half && wk.kind!=="precision");
  const mk = (it, part)=>{ const [id, sets, reps, note] = it; const e = EX[id];
    const isNote = note && note.length>2; const sfx = (!isNote && note) ? note : "";
    const n = half ? Math.max(1, Math.ceil(sets/2)) : sets;
    return {...e, id:id+sfx, base:id, sets:n, reps, noKg:!e.kg, part, note:isNote?note:""}; };
  let list = [];
  if(wk.items) list = wk.items.map(it=>mk(it,"main"));
  else list = [...(wk.pre||[]).map(it=>mk(it,"pre")), ...wk.circuit.map(it=>mk(it,"circuit")), ...(wk.post||[]).map(it=>mk(it,"post"))];
  return {workout:wk, half, list};
}

// Sync with the goblin server (server.py). Works offline: saves stay in this browser and sync next time.
let online=false, syncing=null;
function apiUrl(){ return new URL("api/sync", location.href).toString(); }
async function sync(){
  if(!/^https?:$/.test(location.protocol)){ setStatus("Saved on this device", "off"); return false; }
  if(syncing) return syncing;
  syncing = (async()=>{
    const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 10000);
    try{
      const r = await fetch(apiUrl(), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({logs, knee}), signal:ctrl.signal});
      if(!r.ok) throw new Error("server answered "+r.status);
      const data = await r.json();
      logs = data.logs||{}; knee = data.knee||{};
      if(draft && !draft._dirty) draft = null;
      lsSet("tsl-logs",logs); lsSet("tsl-knee",knee);
      online = true;
      setStatus("Synced "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}), "ok");
      return true;
    }catch(e){
      online = false;
      setStatus("Offline, saved on phone", "off");
      return false;
    }finally{ clearTimeout(t); syncing=null; }
  })();
  return syncing;
}
async function connect(){
  await sync(); render();
  document.addEventListener("visibilitychange", async()=>{ if(document.visibilityState==="visible"){ await sync(); render(); } });
  window.addEventListener("online", async()=>{ await sync(); render(); });
}

    let done=0; rx.list.forEach(x=>{ const n=x.sets; const d=(draft.ex[x.id]||{}).done||[]; for(let i=0;i<n;i++) if(d[i]) done++; });
    v.querySelector("#progCount").textContent = done+" / "+total+" sets";
    const bar = v.querySelector("#progBar"); bar.setAttribute("aria-valuenow", done); bar.firstElementChild.style.width = (total?done/total*100:0)+"%";
  }

  let lastPart = null;
  rx.list.forEach(x=>{
    if(wk.rounds && x.part!==lastPart){ lastPart = x.part; list.appendChild(el(`<div class="eyebrow" style="margin-top:4px">${x.part==="pre"?"Start, once":x.part==="post"?"Finish, once":`Rounds: ${wk.rounds} times through`}</div>`)); }
    const extra = 0;
    const n = x.sets;
    const e = draft.ex[x.id] || (draft.ex[x.id] = {name:x.name, kg:[], reps:[], done:[]});
    const prev = x.noKg ? null : lastFor(x.base, key);
    const unit = x.part==="circuit" ? "Round" : "Set";
    const dm = DEMOS[x.base] || DEMOS[({splitsquat:"rfess", splitbox:"splitjump"})[x.base]];
    const prevKg = prev ? prev.e.kg : [];
    const repTarget = firstNum(x.reps);
    let prevTxt = "";
    if(prev){ const kgs = prev.e.kg.filter(v=>v!==""&&v!=null); prevTxt = `Last time, ${fmt(new Date(prev.key.slice(0,10)+"T00:00:00"))}: <span class="num">${kgs.join(" / ")} kg</span>`; }
    let rows = `<span class="lab">${unit}</span><span class="lab">${x.noKg?"":"kg"}</span><span class="lab">Reps / time</span><span class="lab" style="text-align:center">Done</span>`;
    for(let i=0;i<n;i++){
      const isExtra = extra && i===n-1;
      const ownAbove = e.kg.slice(0,i).filter(v=>v!==""&&v!=null).pop();
      const kgPh = prevKg[i] || ownAbove || prevKg[prevKg.length-1] || (x.acc ? "" : "14");
      rows += `<span class="setno num">${i+1}${isExtra?' <span class="side">L</span>':""}</span>
        ${x.noKg?'<span class="nokg" aria-hidden="true">–</span>':`<input type="number" inputmode="decimal" step="0.5" min="0" id="kg-${x.id}-${i}" value="${esc(e.kg[i]??"")}" placeholder="${esc(kgPh)}" aria-label="Set ${i+1} kilograms">`}
        <input type="number" inputmode="numeric" min="0" id="reps-${x.id}-${i}" value="${esc(e.reps[i]??"")}" placeholder="${esc(repTarget)}" aria-label="Set ${i+1} reps or seconds">
        <button class="chk" id="done-${x.id}-${i}" aria-pressed="${!!e.done[i]}" aria-label="${unit} ${i+1} done">${ico("check")}</button>`;
    }
    const block = el(`<details class="ex" id="ex-${x.id}"><summary><span class="exmeta"><h3>${x.name}</h3><span class="exsub"><span class="rx num">${(x.part==="circuit"||x.sets===1)?x.reps:x.sets+" × "+x.reps}</span><span class="exdone num" data-exdone>${ico("check")}<span></span></span></span></span>${ico("right","chev")}</summary><div class="body">
      ${x.note?`<div class="callout">${ico("info")}<span>${x.note}</span></div>`:""}<p class="how">${x.how}</p>${x.swap?`<p class="why">${ico("info","sm")}<span>Home version. ${x.swap}</span></p>`:""}${dm?`<div class="demo" data-demo="${dm.id}"><button class="ghost demobtn" type="button">${ico("right","sm")}Watch demo <span class="note">· ${esc(dm.by)}</span></button></div>`:""}${prevTxt?`<p class="last">${ico("history","sm")}<span>${prevTxt}</span></p>`:""}<div class="sets">${rows}</div></div></details>`);
    list.appendChild(block);
    const card = list.querySelector("#ex-"+x.id);
    const demo = card.querySelector(".demo");
    if(demo) demo.querySelector("button").onclick=()=>{
      const f=document.createElement("iframe");
      f.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(demo.dataset.demo)+"?autoplay=1&rel=0&playsinline=1&modestbranding=1";
      f.title=x.name+" demo"; f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen=true; f.loading="lazy";
      demo.replaceChildren(f);
    };
    // Closing the card stops a playing demo and puts the button back.
    if(demo){ const btnHtml = demo.innerHTML; const onPlay = demo.querySelector("button").onclick;
      card.addEventListener("toggle", ()=>{ if(!card.open && demo.querySelector("iframe")){ demo.innerHTML = btnHtml; demo.querySelector("button").onclick = onPlay; } }); }
    const markCard = ()=>{ let c=0; for(let i=0;i<n;i++) if(e.done[i]) c++; card.classList.toggle("complete", c===n); card.querySelector("[data-exdone] span").textContent = c+" / "+n+" "+unit.toLowerCase()+(n===1?"":"s"); };
    for(let i=0;i<n;i++){
      const kg = list.querySelector(`#kg-${x.id}-${i}`), rp = list.querySelector(`#reps-${x.id}-${i}`), dn = list.querySelector(`#done-${x.id}-${i}`);
      if(kg) kg.oninput=()=>{ e.kg[i]=kg.value; draft._dirty=true;
        // Later empty sets suggest the weight you just typed.
        for(let j=i+1;j<n;j++){ const k2=list.querySelector(`#kg-${x.id}-${j}`); if(k2 && !k2.value && kg.value) k2.placeholder=kg.value; } };
      rp.oninput=()=>{ e.reps[i]=rp.value; draft._dirty=true; };
      dn.onclick=()=>{
        e.done[i]=!e.done[i]; draft._dirty=true; dn.setAttribute("aria-pressed", String(!!e.done[i]));
        // Ticking a set with empty fields fills in the suggested numbers, so a set done as planned is one tap.
        if(e.done[i]){
          if(kg && !kg.value && kg.placeholder){ kg.value = kg.placeholder; e.kg[i] = kg.value; }
          if(!rp.value && rp.placeholder){ rp.value = rp.placeholder; e.reps[i] = rp.value; }
        }
        markCard(); updateProgress();
      };
    }
    markCard();
  });

  const foot = el(`<div class="card"><label class="field" for="note">How it felt<textarea id="note" placeholder="Sleep, soreness, how the left knee felt"></textarea></label>
    <button class="primary" id="save">${ico("save")}<span>Save session</span></button>
    <p class="status" id="saveMsg" role="status" aria-live="polite">${logs[key]?"Saved earlier. Saving again replaces it.":""}</p></div>`);
  v.appendChild(foot);
  v.appendChild(fuelCard(selDate));
  updateProgress();
  const note = v.querySelector("#note"); note.value = draft.note||""; note.oninput=()=>{ draft.note=note.value; draft._dirty=true; };
  v.querySelector("#save").onclick = async(ev)=>{
    const btn = ev.currentTarget; if(btn.disabled) return;
    const msg = v.querySelector("#saveMsg"); btn.disabled=true; btn.querySelector("span").textContent="Saving…"; msg.className="status"; msg.textContent="";
    const body = JSON.parse(JSON.stringify(draft)); delete body.key; delete body._dirty; draft._dirty=false; body.savedAt = new Date().toISOString();
    try{
      const ok = await saveLog(key, body);
      msg.className = "status "+(ok?"ok":"off");
      msg.innerHTML = ok ? ico("check","sm")+"Saved and synced with goblin." : ico("alert","sm")+"Saved on this phone. It will sync when goblin is reachable.";
    }catch(err){ msg.className="status off"; msg.innerHTML = ico("alert","sm")+"Couldn't save ("+esc(err.message||"error")+"). Your sets are still here, try again."; draft._dirty=true; }
    finally{ btn.disabled=false; btn.querySelector("span").textContent="Save session"; }
  };
}

function renderPlan(){
  const v = document.getElementById("view");
  const cw = weekOf(today);
  const days = [["Mon","Precision","k-str"],["Tue","Speed",""],["Wed","Perform­ance","k-str"],["Thu","Rest",""],["Fri","Speed",""],["Sat","Rest",""],["Sun","Long",""]];
  const tdow = (today.getDay()+6)%7;
  const week7 = days.map((d,i)=>`<div class="${d[2]} ${i===tdow?"is-today":""}"><span class="muted">${d[0]}</span><b>${d[1]}</b></div>`).join("");
  let rows = "";
  PHASES.forEach(p=>{
    const s = weekStart(p.w[0]), e = new Date(weekStart(p.w[1]).getTime()+6*dayMs);
    const now = cw>=p.w[0] && cw<=p.w[1];
    const past = cw>p.w[1];
    const isRace = /race week/i.test(p.name);
    rows += `<div class="tlrow ${now?"now":""} ${past?"past":""} ${isRace?"race-row":""}"><div class="rail"><i></i></div>
      <div class="box"><div class="t"><b>${p.name}</b>${now?'<span class="badge accent">Now</span>':""}${isRace?`<span class="badge">${ico("flag","sm")}Race</span>`:""}</div>
      <div class="wk num">Week ${p.w[0]}${p.w[1]!==p.w[0]?"–"+p.w[1]:""} · ${s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</div>
      <p class="note" style="margin-top:4px">${p.note}</p></div></div>`;
  });
  v.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="card"><h2>Every week</h2><div class="week7">${week7}</div></div>
    <div class="card"><h2>The workouts</h2><p class="note">All from Jay Dicharry's <i>Running Rewired</i>, set up for your kettlebell, bands and stairs. The Today tab picks the right one each day.</p>
      <div>${WORKOUT_ORDER.map(id=>{ const wk=WORKOUTS[id]; const items=[...(wk.pre||[]),...(wk.circuit||[]),...(wk.post||[]),...(wk.items||[])];
        return `<details class="fuelrace"><summary><span><b>${wk.num}. ${wk.name}</b> <span class="note">· ${KIND_LABEL[wk.kind].replace(" workout","")} · ${wk.min}${wk.rounds?` · ${wk.rounds} rounds`:""}</span></span>${ico("right","sm")}</summary><ul>${items.map(([eid,sets,reps])=>`<li>${EX[eid].name}, ${sets>1&&!wk.rounds?sets+" × ":""}${reps}${EX[eid].swap?' <span class="note">(home version)</span>':""}</li>`).join("")}</ul></details>`; }).join("")}</div>
      <p class="note">Left out: the hang spine twist in Workouts 9 and 13, which needs a pull-up bar.</p></div>
    <div class="card"><h2>Race week checklists</h2><p class="note">Each one shows on the Today tab during its race week. You can tick items here too.</p><div id="rcPlan" style="display:flex;flex-direction:column;gap:12px"></div></div>
    <div class="card"><h2>${ico("fuel","sm")} Fueling</h2><p class="note">How to eat for this training, in short, from Matt Fitzgerald's <i>The Endurance Diet</i> (2016).</p>
      <ul class="principles">${FUEL_HABITS.map(([t,d])=>`<li><b>${t}</b><span class="note">${d}</span></li>`).join("")}</ul>
      <h3 style="margin-top:6px">During runs and races</h3>
      <ul class="fuelrules">${FUEL_DURING.map(([t,d])=>`<li><b>${t}</b><span class="note">${d}</span></li>`).join("")}</ul>
      <blockquote class="quote">“they’re not supposed to be healthy; they’re supposed to enhance performance.”</blockquote>
      <div>${["divca","jablanik"].map(id=>`<details class="fuelrace"><summary><b>${ico("flag","sm")} ${FUEL_RACE[id].title}</b>${ico("right","sm")}</summary><ul>${FUEL_RACE[id].items.map(i=>`<li>${i}</li>`).join("")}</ul></details>`).join("")}
        <details class="fuelrace"><summary><b>Every day</b>${ico("right","sm")}</summary><ul>${FUEL_HEALTH.map(i=>`<li>${i}</li>`).join("")}</ul></details></div></div>
    <div class="card"><h2>Principles</h2><p class="note">The ideas behind this plan, in short, from Jay Dicharry's <i>Running Rewired</i> (2017).</p>
      <blockquote class="quote">“Variety and repetition are the building blocks of motor learning.”</blockquote>
      <ul class="principles">${PRINCIPLES.map(([t,d])=>`<li><b>${t}</b><span class="note">${d}</span></li>`).join("")}</ul>
      <blockquote class="quote">“practice › plasticity › growth = rewired for success”</blockquote></div>
    <div class="card"><h2>22 weeks to Jablanik</h2><div class="tl">${rows}</div>
    <div class="callout">${ico("info")}<span>The book's rule for load: as heavy as perfect form allows. 14 kg will soon be light for squats, deadlifts and hip thrusts; slow the lowering, or get a 20–24 kg bell.</span></div></div></div>`;
  const rcp = v.querySelector("#rcPlan"); RACE_WEEKS.forEach(rw=>rcp.appendChild(renderRaceCheck(rw, -1)));
}

function backupBar(v){
  const bar = el(`<div class="card"><h2>Backup</h2><p class="note">Your log is kept on goblin and on this phone. Export gives you a file copy too.</p>
    <div class="row"><button class="ghost" id="exportBtn">${ico("download")}Export log</button><label class="ghost btn" for="importFile">${ico("upload")}Import log</label><input type="file" id="importFile" accept="application/json" class="sr"></div><p class="status" id="backupMsg" role="status" aria-live="polite"></p></div>`);
  v.appendChild(bar);
  v.querySelector("#exportBtn").onclick=()=>{
    const blob = new Blob([JSON.stringify({app:"trail-strength-log",version:1,logs,knee},null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "trail-strength-log-"+iso(new Date())+".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    v.querySelector("#backupMsg").textContent = "Exported.";
  };
  v.querySelector("#importFile").onchange=async(ev)=>{
    const f = ev.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(!data || data.app!=="trail-strength-log") throw new Error("Not a Trail Strength Log export.");
      logs = Object.assign({}, logs, data.logs||{}); knee = Object.assign({}, knee, data.knee||{});
      lsSet("tsl-logs",logs); lsSet("tsl-knee",knee); draft=null;
      const n = Object.keys(data.logs||{}).length;
      await sync(); render();
      const m = document.getElementById("backupMsg"); if(m) m.textContent = "Imported "+n+" sessions.";
    }catch(e){ v.querySelector("#backupMsg").textContent = "Couldn't import: "+e.message; }
  };
}
function renderHistory(){
  const v = document.getElementById("view");
  const keys = Object.keys(logs).filter(k=>/^\d{4}-\d\d-\d\d_(A|B|P\d|W\d+)$/.test(k)).sort().reverse();
  if(!keys.length){ v.innerHTML = `<div class="card empty"><div class="big">${ico("history")}</div><h2>No sessions yet</h2><p class="muted">Log your first session on the Today tab. Saved sessions show up here, newest first.</p></div>`; backupBar(v); return; }
  v.innerHTML = `<h2>${keys.length} session${keys.length===1?"":"s"} logged</h2><div class="hist">${keys.map(k=>{
    const l = logs[k]; const ex = Object.values(l.ex||{});
    const doneSets = ex.reduce((a,e)=>a+(e.done||[]).filter(Boolean).length,0);
    const d = new Date(k.slice(0,10)+"T00:00:00");
    return `<button class="hitem" data-key="${esc(k)}"><span class="date"><b>${d.getDate()}</b><span>${d.toLocaleDateString("en-GB",{month:"short"})}</span></span>
      <span class="what"><b>${WORKOUTS[l.session]?esc(WORKOUTS[l.session].num+". "+WORKOUTS[l.session].name):"Session "+esc(l.session)+" (old plan)"} <span class="muted" style="font-weight:500">· ${d.toLocaleDateString("en-GB",{weekday:"short"})}</span></b><span class="note">${esc(l.phase||"")}${l.note?" · "+esc(l.note):""}</span></span>
      <span class="right num">${doneSets} ${/^P/.test(l.session)?"ticks":"sets"}${ico("right","sm")}</span></button>`;
  }).join("")}</div>`;
  v.querySelectorAll(".hitem").forEach(b=>b.onclick=()=>{
    const k=b.dataset.key; selDate=new Date(k.slice(0,10)+"T00:00:00"); selSession=k.slice(11); draft=null; setView("today");
  });
  backupBar(v);
}

function renderKnee(){
  const v = document.getElementById("view");
  const nextD = KNEE_DATES.find(d=>{ const r=knee[d]||{}; return !(r.left&&r.right); });
  let latest = null;
  KNEE_DATES.forEach(d=>{ const r=knee[d]||{}; if(r.left!==undefined&&r.left!==""&&r.right!==undefined&&r.right!=="") latest={d, L:+r.left, R:+r.right}; });
  let rows = KNEE_DATES.map(d=>{
    const r = knee[d]||{}; const L=+r.left, R=+r.right;
    const has = r.left!==undefined&&r.left!==""&&r.right!==undefined&&r.right!=="";
    const gap = has ? R-L : null;
    const gapTxt = gap===null ? "" : gap<=2 ? `<span class="gap gap-good">${ico("check","sm")}On target${gap>0?", left "+gap+" behind":gap<0?", left "+(-gap)+" ahead":", even"}</span>`
      : `<span class="gap gap-bad">${ico("alert","sm")}Left ${gap} behind</span>`;
    const dd = new Date(d+"T00:00:00");
    return `<div class="krow ${d===nextD?"next":""}"><div class="d"><b class="num">${dd.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</b>${d===nextD&&!has?'<span class="note">Next test</span>':""}${gapTxt}</div>
      <input type="number" inputmode="numeric" min="0" id="kl-${d}" value="${esc(r.left??"")}" aria-label="Left leg reps on ${dd.toLocaleDateString("en-GB")}">
      <input type="number" inputmode="numeric" min="0" id="kr-${d}" value="${esc(r.right??"")}" aria-label="Right leg reps on ${dd.toLocaleDateString("en-GB")}"></div>`;
  }).join("");
  let compare = "";
  if(latest){
    const max = Math.max(latest.L, latest.R, 1);
    compare = `<div class="compare" aria-label="Latest test: left ${latest.L}, right ${latest.R}">
      <div class="r"><span>Left</span><span class="b"><span style="width:${latest.L/max*100}%;background:var(--accent)"></span></span><span class="num">${latest.L}</span></div>
      <div class="r"><span>Right</span><span class="b"><span style="width:${latest.R/max*100}%;background:var(--muted)"></span></span><span class="num">${latest.R}</span></div></div>`;
  }
  v.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="card"><h2>Left vs right step-down</h2>
      <p class="note">Count slow, controlled step-downs from one stair on each leg until form breaks.</p>
      <div class="kgoal"><span class="badge accent" style="align-self:flex-start">${ico("flag","sm")}Goal: left within 2 reps of right by Divča</span>${compare}</div></div>
    <div class="card" style="gap:0"><div class="krow head"><span>Test date</span><span style="text-align:center">Left</span><span style="text-align:center">Right</span></div>${rows}</div></div>`;
  KNEE_DATES.forEach(d=>{
    ["l","r"].forEach(s=>{
      const inp = v.querySelector(`#k${s}-${d}`);
      inp.onchange = ()=>{ knee[d] = {...(knee[d]||{}), [s==="l"?"left":"right"]: inp.value}; saveKnee(); renderKnee(); };
    });
  });
}

function setView(name){
  view = name; // an unsaved draft stays in memory, so switching tabs and back keeps your sets
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.view===name)));
  document.getElementById("view").setAttribute("aria-labelledby","tab-"+name);
  render();
  window.scrollTo({top:0});
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>setView(b.dataset.view));

function render(){
  renderHeader();
  document.getElementById("racecard").hidden = view!=="today"; // countdown lives on Today, other tabs start with their content
  const active = document.activeElement && document.activeElement.id;
  if(view==="today"){ if(active && /^(kg|reps|note)/.test(active)) return; renderToday(); }
  else if(view==="plan") renderPlan();
  else if(view==="history") renderHistory();
  else { if(active && /^k[lr]-/.test(active)) return; renderKnee(); }
}
render();
applyTheme(getTheme());
connect();
})();
</script>
